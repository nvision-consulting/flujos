<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flujo de procesos en Odoo 20 · Sygar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --font-display:"Chakra Petch","Rajdhani","Segoe UI",system-ui,sans-serif;
  --font-body:"Hanken Grotesk","Segoe UI",system-ui,-apple-system,sans-serif;
  --nv-navy:#00142B;
  --bg:#EDF1F6; --surface:#FFFFFF; --surface-2:#F4F7FA;
  --ink:#0D1B2E; --ink-2:#3B4D64; --ink-3:#64758C;
  --line:rgba(13,27,46,.12); --line-2:rgba(13,27,46,.22);
  --trace:#B5C1D2; --trace-on:#0A4FD8; --pulse:#2F8BFF;
  --accent:#0A54E7; --accent-soft:rgba(10,84,231,.14); --on-accent:#FFFFFF;
  --sg-blue:#0A54E7; --sg-blue-2:#0A3C9D;
  --grid-dot:rgba(13,27,46,.11); --shadow:rgba(13,27,46,.12);
  --chip-bg:rgba(10,84,231,.08); --chip-ink:#0A45B8;
  --drawer-w:clamp(340px,31vw,460px);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#031029; --surface:#0A1A38; --surface-2:#0E2347;
    --ink:#EAF1FA; --ink-2:#A9B8CB; --ink-3:#73859D;
    --line:rgba(150,180,220,.13); --line-2:rgba(150,180,220,.25);
    --trace:#1B3768; --trace-on:#4C9BFF; --pulse:#7DB8FF;
    --accent:#3F86FF; --accent-soft:rgba(63,134,255,.2);
    --grid-dot:rgba(140,180,235,.10); --shadow:rgba(0,0,0,.5);
    --chip-bg:rgba(76,155,255,.12); --chip-ink:#A9CDFF;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#031029; --surface:#0A1A38; --surface-2:#0E2347;
  --ink:#EAF1FA; --ink-2:#A9B8CB; --ink-3:#73859D;
  --line:rgba(150,180,220,.13); --line-2:rgba(150,180,220,.25);
  --trace:#1B3768; --trace-on:#4C9BFF; --pulse:#7DB8FF;
  --accent:#3F86FF; --accent-soft:rgba(63,134,255,.2);
  --grid-dot:rgba(140,180,235,.10); --shadow:rgba(0,0,0,.5);
  --chip-bg:rgba(76,155,255,.12); --chip-ink:#A9CDFF;
  color-scheme:dark;
}
*,*::before,*::after{ box-sizing:border-box; }
html{ height:100%; scroll-padding-top:env(safe-area-inset-top,0px); }
body{ margin:0; height:100%; overflow:hidden; display:grid; grid-template-rows:auto 1fr auto; grid-template-columns:minmax(0,1fr);
  background:var(--bg); color:var(--ink); font-family:var(--font-body); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased; }
body::before{ content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:10; background:var(--surface); }
button{ font:inherit; }
.ico{ width:20px; height:20px; flex:none; display:block; }
.btn{ font:600 13.5px/1 var(--font-body); color:var(--ink); background:transparent; border:1px solid var(--line-2);
  border-radius:9px; padding:9px 13px; display:inline-flex; align-items:center; justify-content:center; gap:8px; cursor:pointer;
  transition:background .2s,border-color .2s,color .2s,opacity .2s; }
.btn .ico{ width:17px; height:17px; }
.btn:hover{ background:var(--chip-bg); border-color:var(--trace-on); }
.btn.icon{ padding:9px; }
.btn.primary{ background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
.btn.primary:hover{ filter:brightness(1.08); background:var(--accent); }
.btn.lg{ padding:14px 22px; font-size:15px; border-radius:11px; }
.btn:disabled{ opacity:.4; cursor:default; }
.btn:focus-visible,.node:focus-visible,.seg:focus-visible,.mcard:focus-visible{ outline:2px solid var(--trace-on); outline-offset:2px; }

/* Barra superior */
.topbar{ min-width:0; position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:14px; padding:10px 18px;
  background:var(--surface); border-bottom:1px solid var(--line); }
.brand-tiles{ display:flex; gap:6px; }
.tile{ display:grid; place-items:center; border-radius:9px; overflow:hidden; background:var(--nv-navy); }
.tile.sm{ width:38px; height:38px; } .tile.sm img{ height:28px; width:auto; display:block; }
.tile.big{ width:96px; height:96px; border-radius:20px; } .tile.big img{ height:66px; width:auto; display:block; }
.tile.client{ background:#fff; border:1px solid var(--line); } .tile.client img{ max-width:84%; max-height:84%; height:auto; }
.tile.sygar{ background:radial-gradient(120% 120% at 50% 42%,var(--sg-blue),var(--sg-blue-2)); border:0; }
.tile.sm.sygar{ width:104px; } .tile.sm.sygar img{ width:80%; height:auto; }
.tile.big.sygar{ width:240px; } .tile.big.sygar img{ width:80%; height:auto; }
.top-title{ display:flex; flex-direction:column; line-height:1.2; min-width:0; }
.top-title strong{ font:700 16px/1.2 var(--font-display); letter-spacing:.2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.top-title span{ font-size:12.5px; color:var(--ink-3); }
.top-tools{ margin-left:auto; display:flex; gap:8px; }

/* Escenario y tablero */
.stage{ position:relative; overflow:hidden; background-color:var(--bg);
  background-image:radial-gradient(var(--grid-dot) 1px, transparent 1.2px); background-size:22px 22px; }
.board{ position:absolute; left:0; top:0; transform-origin:0 0; }
.board-head{ position:absolute; left:60px; top:30px; right:60px; }
.board-head h1{ margin:0 0 6px; font:700 28px/1.15 var(--font-display); letter-spacing:.2px; text-wrap:balance; }
.board-head p{ margin:0; max-width:760px; color:var(--ink-2); font-size:15.5px; }
.board-legend{ position:absolute; left:60px; bottom:22px; display:flex; flex-wrap:wrap; gap:22px; color:var(--ink-3); font-size:12.5px; }
.lg{ display:flex; align-items:center; gap:8px; }
.lg-trace{ width:34px; height:3px; border-radius:2px; background:var(--trace-on); }
.lg-step{ width:14px; height:14px; border-radius:4px; border:2px solid var(--accent); }
.gen-mark{ display:inline-grid; place-items:center; width:20px; height:20px; border-radius:6px; background:var(--accent-soft); color:var(--accent); }
.gen-mark .ico{ width:13px; height:13px; }
svg.traces{ position:absolute; left:0; top:0; overflow:visible; pointer-events:none; }
.edge{ fill:none; stroke:var(--trace); stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; transition:stroke .3s, opacity .3s; }
.edge.on{ stroke:var(--trace-on); stroke-width:3; stroke-dasharray:8 7; animation:flow 1.1s linear infinite; }
.edge.dim{ opacity:.25; }
@keyframes flow{ to{ stroke-dashoffset:-30; } }
.packet{ fill:var(--pulse); filter:drop-shadow(0 0 5px var(--pulse)); }
.elabel{ position:absolute; z-index:3; transform:translate(-50%,-50%); font-size:11px; font-weight:600; line-height:1.2; color:var(--ink-2);
  background:var(--surface); border:1px solid var(--line); border-radius:9px; padding:3px 8px; text-align:center;
  max-width:96px; width:max-content; transition:opacity .3s, color .3s, border-color .3s; }
.elabel.side{ transform:translate(0,-50%); text-align:left; max-width:150px; }
.elabel.wide{ max-width:260px; }
.elabel.opt{ border-style:dashed; }
.edge.opt:not(.on){ stroke-dasharray:3 7; }
.band-note{ position:absolute; padding:16px 18px; border-radius:16px; border:1.5px dashed var(--line-2); color:var(--ink-2); transition:opacity .35s; }
.band-note strong{ display:block; margin-bottom:6px; font:700 17px/1.2 var(--font-display); color:var(--ink); }
.band-note span{ font-size:13.5px; line-height:1.45; }
.band-note.dim{ opacity:.32; }
.elabel.on{ color:var(--trace-on); border-color:var(--trace-on); }
.elabel.dim{ opacity:.25; }

/* Nodos */
.node{ position:absolute; border-radius:16px; background:var(--surface); border:1.5px solid var(--line-2); cursor:pointer;
  box-shadow:0 10px 24px var(--shadow); padding:14px 15px; display:flex; flex-direction:column; gap:7px; text-align:left;
  color:var(--ink); transition:opacity .35s, transform .35s, border-color .3s, box-shadow .3s; }
.node:hover{ border-color:var(--trace-on); transform:translateY(-2px); }
.node.dim{ opacity:.32; }
.node.active{ border-color:var(--accent); box-shadow:0 0 0 4px var(--accent-soft), 0 14px 30px var(--shadow); }
.node.auto{ border-style:dashed; }
.node.decision{ border-radius:24px; background:linear-gradient(160deg,var(--surface),var(--surface-2)); }
.node.resultado{ background:linear-gradient(160deg,var(--surface),var(--chip-bg)); }
.n-row{ display:flex; align-items:center; gap:8px; }
.n-badge{ width:24px; height:24px; border-radius:7px; display:grid; place-items:center; background:var(--nv-navy); color:#fff; font:700 12.5px/1 var(--font-display); }
:root[data-theme="dark"] .n-badge{ background:var(--trace-on); color:#031029; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .n-badge{ background:var(--trace-on); color:#031029; } }
.node.active .n-badge{ background:var(--accent); color:var(--on-accent); }
.n-app{ font-size:11.5px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; color:var(--chip-ink); background:var(--chip-bg); border-radius:6px; padding:3px 7px; }
.n-icon{ margin-left:auto; color:var(--ink-3); }
.n-title{ font:700 16px/1.2 var(--font-display); letter-spacing:.1px; }
.n-micro{ font-size:13px; color:var(--ink-2); line-height:1.35; }
.node .gen-mark{ position:absolute; top:-9px; right:-9px; }
.area-tag{ position:absolute; font:600 11.5px/1 var(--font-body); letter-spacing:1.2px; text-transform:uppercase; color:var(--ink-3); white-space:nowrap; }

/* Panel de detalle */
.drawer{ position:absolute; top:0; right:0; bottom:0; width:var(--drawer-w); background:var(--surface); border-left:1px solid var(--line);
  box-shadow:-18px 0 40px var(--shadow); transform:translateX(105%); transition:transform .38s cubic-bezier(.2,.8,.2,1);
  display:flex; flex-direction:column; z-index:15; }
.drawer.open{ transform:none; }
.drawer-close{ position:absolute; top:12px; right:12px; z-index:2; }
.drawer-scroll{ overflow:auto; padding:26px 26px 18px; flex:1; }
.d-step{ font-size:12.5px; font-weight:700; color:var(--ink-3); letter-spacing:.6px; text-transform:uppercase; margin-bottom:8px; }
.drawer h2{ margin:0 40px 10px 0; font:700 23px/1.2 var(--font-display); }
.chips{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; }
.chip{ font-size:12px; font-weight:600; color:var(--chip-ink); background:var(--chip-bg); border-radius:999px; padding:4px 10px; }
.lead{ color:var(--ink-2); font-size:15px; margin:0 0 16px; }
.drawer h3{ margin:18px 0 8px; font:700 13px/1.2 var(--font-body); letter-spacing:.7px; text-transform:uppercase; color:var(--ink-3); }
.drawer ul{ margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:9px; }
.drawer li{ position:relative; padding-left:22px; font-size:14.5px; }
.drawer li::before{ content:""; position:absolute; left:4px; top:8px; width:8px; height:8px; border-radius:2px; background:var(--trace-on); transform:rotate(45deg); }
.gain{ margin-top:18px; border-radius:12px; padding:14px 16px; background:var(--accent-soft); border:1px solid var(--accent); }
.gain h3{ margin:0 0 6px; color:var(--accent); }
.gain p{ margin:0; font-size:14.5px; }
.drawer-nav{ display:flex; justify-content:space-between; gap:10px; padding:14px 20px; border-top:1px solid var(--line); }

/* Barra del recorrido */
.tourbar{ min-width:0; display:flex; align-items:center; gap:14px; padding:10px 18px; background:var(--surface); border-top:1px solid var(--line); }
.tb-controls{ display:flex; gap:6px; }
.tb-current{ font:600 13.5px/1.2 var(--font-body); min-width:160px; color:var(--ink-2); }
.timeline{ flex:1; display:flex; gap:5px; min-width:0; }
.seg{ flex:1; min-width:10px; height:30px; border-radius:7px; border:1px solid var(--line-2); background:transparent; cursor:pointer;
  color:var(--ink-3); font:600 11.5px/1 var(--font-body); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding:0 6px; }
.seg.done{ background:var(--chip-bg); color:var(--chip-ink); border-color:transparent; }
.seg.current{ background:var(--accent); border-color:var(--accent); color:var(--on-accent); }

/* Portada */
.cover{ position:fixed; inset:0; z-index:40; display:grid; place-items:center; padding:24px; background:var(--bg);
  background-image:radial-gradient(var(--grid-dot) 1px, transparent 1.2px); background-size:22px 22px; transition:opacity .45s, visibility .45s; }
.cover.hide{ opacity:0; visibility:hidden; }
.cover-inner{ max-width:720px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:18px; }
.cover-brands{ display:flex; align-items:center; gap:18px; }
.cover-x{ color:var(--ink-3); font:600 26px/1 var(--font-display); }
.cover h1{ margin:6px 0 0; font:700 40px/1.1 var(--font-display); letter-spacing:.3px; text-wrap:balance; }
.cover p{ margin:0; color:var(--ink-2); font-size:17px; max-width:600px; }
.cover-actions{ display:flex; flex-wrap:wrap; justify-content:center; gap:10px; margin-top:8px; }
.cover-hint{ font-size:13px !important; color:var(--ink-3) !important; }

/* Vista móvil */
.mlist{ display:none; }
@media (max-width: 759px){
  .board{ display:none; }
  .stage{ overflow:auto; }
  .mlist{ display:flex; flex-direction:column; gap:0; padding:20px 16px 30px; }
  .mlist h1{ margin:0 0 6px; font:700 23px/1.2 var(--font-display); }
  .mlist > p{ margin:0 0 18px; color:var(--ink-2); }
  .mcard{ position:relative; text-align:left; background:var(--surface); border:1.5px solid var(--line-2); border-radius:14px; padding:13px 14px;
    display:flex; flex-direction:column; gap:6px; color:var(--ink); cursor:pointer; }
  .mcard.active{ border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
  .mcard.auto{ border-style:dashed; }
  .mconn{ align-self:center; width:2px; min-height:26px; background:var(--trace); position:relative; margin:4px 0; }
  .mconn span{ position:absolute; left:12px; top:50%; transform:translateY(-50%); white-space:nowrap; font-size:11.5px; color:var(--ink-3); font-weight:600; }
  .drawer{ top:auto; left:0; width:auto; height:78%; border-left:0; border-top:1px solid var(--line); border-radius:18px 18px 0 0; transform:translateY(105%);
    padding-bottom:env(safe-area-inset-bottom,0px); }
  .drawer.open{ transform:none; }
  .tb-current,.btn-label{ display:none; }
  .seg{ font-size:0; padding:0; height:10px; border-radius:5px; }
  .cover h1{ font-size:30px; }
  .topbar{ padding:8px 12px; gap:10px; }
  .tile.sm.sygar{ width:84px; }
  .tile.big.sygar{ width:180px; height:80px; }
  .tile.big{ width:80px; height:80px; } .tile.big img{ height:54px; }
  .cover-brands{ gap:12px; }
}
@media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } }
</style>
</head>

/* ---------- Diseño fijo en tres franjas ---------- */
const CW = 228, CH = 150, GX = 104;
const ROWY = { c:196, a0:430, a1:620, am:525, b:870 };
const COLX = c => 60 + c * (CW + GX);

/* ---------- Rutas de las conexiones ---------- */
function rounded(pts, r = 12){
  let d = `M${pts[0][0]},${pts[0][1]}`;
  for (let i = 1; i < pts.length - 1; i++){
    const [x0,y0] = pts[i-1], [x1,y1] = pts[i], [x2,y2] = pts[i+1];
    const d1 = Math.hypot(x1-x0, y1-y0) || 1, d2 = Math.hypot(x2-x1, y2-y1) || 1;
    const rr = Math.min(r, d1/2, d2/2);
    const ax = x1 - (x1-x0)/d1*rr, ay = y1 - (y1-y0)/d1*rr;
    const bx = x1 + (x2-x1)/d2*rr, by = y1 + (y2-y1)/d2*rr;
    d += ` L${ax},${ay} Q${x1},${y1} ${bx},${by}`;
  }
  const last = pts[pts.length-1];
  return d + ` L${last[0]},${last[1]}`;
}
EDGES.forEach(e => {
  const a = BY[e.de], b = BY[e.a], ruta = e.ruta || 'h', dx = e.dx || 0, cy = e.carril;
  let pts, lx, ly, cls = '';
  if (ruta === 'v'){
    const sx = a.x + CW/2 + dx, sy = a.y + CH, ex = b.x + CW/2 + dx, ey = b.y;
    pts = [[sx,sy],[ex,ey]]; lx = sx + 10; ly = (sy + ey) / 2; cls = 'side';
  } else if (ruta === 'retorno'){
    const sx = a.x + CW/2 + dx, sy = a.y + CH, ex = b.x + CW/2, ey = b.y;
    pts = [[sx,sy],[sx,cy],[ex,cy],[ex,ey]]; lx = (sx + ex) / 2; ly = cy; cls = 'wide';
  } else if (ruta === 'subida'){
    const sx = a.x + CW/2 + dx, sy = a.y, ex = b.x + CW/2, ey = b.y + CH;
    pts = [[sx,sy],[sx,cy],[ex,cy],[ex,ey]]; lx = (sx + ex) / 2; ly = cy; cls = 'wide';
  } else if (ruta === 'vuelta'){
    const sx = a.x + CW, sy = a.y + CH/2, xr = sx + 40, ex = b.x + CW/2, ey = b.y;
    pts = [[sx,sy],[xr,sy],[xr,cy],[ex,cy],[ex,ey]]; lx = (xr + ex) / 2; ly = cy; cls = 'wide';
  } else {
    const sx = a.x + CW, sy = a.y + CH/2, ex = b.x, ey = b.y + CH/2;
    if (Math.abs(ey - sy) < 2){ pts = [[sx,sy],[ex,ey]]; lx = (sx + ex) / 2; ly = sy - 22; }
    else { const xm = sx + GX/2; pts = [[sx,sy],[xm,sy],[xm,ey],[ex,ey]]; lx = xm; ly = (sy + ey) / 2; }
  }
  if (e.opcional) cls += ' opt';
  e.d = rounded(pts); e.lx = lx; e.ly = ly; e.cls = cls.trim();
});

const segs = PASOS.map((p, i) => {
  const s = document.createElement('button'); s.className = 'seg'; s.textContent = PASOS.length > 12 ? `${i + 1}` : `${i + 1}. ${p.etiqueta_corta || p.titulo}`;
  s.title = p.titulo; s.addEventListener('click', () => goTo(i)); timeline.appendChild(s); return s;
});

/* ---------- Escala ---------- */
const drawer = $('#drawer');
function fit(){
  const r = stage.getBoundingClientRect();
  const avail = r.width - (drawer.classList.contains('open') && innerWidth >= 760 ? Math.min(460, Math.max(340, innerWidth * .31)) : 0);
  const s = Math.min(avail / W, r.height / H, 1.25);
  const ox = Math.max(0, (avail - W * s) / 2), oy = Math.max(0, (r.height - H * s) / 2);
  board.style.transform = `translate(${ox}px,${oy}px) scale(${s})`;
}
addEventListener('resize', fit);

/* ---------- Estado y recorrido ---------- */
const state = { cur:-1, playing:false };
let timer = null, packets = [];
const reduce = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
function clearPackets(){ packets.forEach(p => p.remove()); packets = []; }
function addPacket(e){
  if (reduce()) return;
  const c = document.createElementNS(SVGNS, 'circle'); c.setAttribute('r', '5'); c.setAttribute('class', 'packet');
  const am = document.createElementNS(SVGNS, 'animateMotion'); am.setAttribute('dur', '1.8s'); am.setAttribute('repeatCount', 'indefinite');
  const mp = document.createElementNS(SVGNS, 'mpath'); mp.setAttribute('href', '#p-' + e.id); am.appendChild(mp); c.appendChild(am);
  svg.appendChild(c); packets.push(c);
}
function paint(){
  const i = state.cur, p = PASOS[i];
  clearPackets();
  const focus = new Set(), lit = new Set();
  if (p){
    focus.add(p.id);
    EDGES.forEach(e => { if (e.a === p.id || e.de === p.id){ lit.add(e.id); focus.add(e.de); focus.add(e.a); } });
  }
  PASOS.forEach(q => {
    const n = nodeEls[q.id];
    n.classList.toggle('active', !!p && q.id === p.id);
    n.classList.toggle('dim', !!p && !focus.has(q.id));
    board.querySelectorAll('.band-note').forEach(b => b.classList.toggle('dim', !!p));
    const m = mlist.querySelector(`[data-id="${q.id}"]`); if (m) m.classList.toggle('active', !!p && q.id === p.id);
  });
  EDGES.forEach(e => {
    const on = lit.has(e.id);
    edgeEls[e.id].classList.toggle('on', on); edgeEls[e.id].classList.toggle('dim', !!p && !on);
    if (labelEls[e.id]){ labelEls[e.id].classList.toggle('on', on); labelEls[e.id].classList.toggle('dim', !!p && !on); }
    if (on && e.a === p.id) addPacket(e);
  });
  segs.forEach((s, k) => { s.classList.toggle('current', k === i); s.classList.toggle('done', i >= 0 && k < i); });
  $('#tbCurrent').textContent = p ? `Paso ${i + 1} de ${PASOS.length} · ${p.titulo}` : 'Vista general';
  $('#btnPrev').disabled = i <= 0; $('#btnNext').disabled = i >= PASOS.length - 1 && i !== -1 ? false : false;
  const fin = i === -1 && state.finished && DATA.cierre;
  $('#bhTitle').textContent = fin ? DATA.cierre.titulo : headTitle;
  $('#bhText').textContent = fin ? DATA.cierre.texto : headText;
}
function drawerHTML(p){
  const apps = (p.apps || (p.app ? [p.app] : [])).map(a => `<span class="chip">${esc(a)}</span>`).join('');
  const puntos = (p.puntos || []).map(t => `<li>${esc(t)}</li>`).join('');
  return `<div class="d-step">Paso ${p.idx + 1} de ${PASOS.length}${p.area ? ' · ' + esc(p.area) : ''}</div>
    <h2 id="dTitle">${esc(p.titulo)}</h2>${apps ? `<div class="chips">${apps}</div>` : ''}
    ${p.detalle ? `<p class="lead">${esc(p.detalle)}</p>` : ''}
    ${puntos ? `<h3>Cómo funcionará</h3><ul>${puntos}</ul>` : ''}
    ${p.beneficio ? `<div class="gain"><h3>Qué gana ${esc(cliente || 'su empresa')}</h3><p>${esc(p.beneficio)}</p></div>` : ''}`;
}
function openDrawer(p){
  $('#dContent').innerHTML = drawerHTML(p); $('#dContent').scrollTop = 0;
  drawer.classList.add('open'); drawer.setAttribute('aria-hidden', 'false');
  $('#dPrev').disabled = p.idx === 0;
  $('#dNext').innerHTML = p.idx === PASOS.length - 1 ? 'Ver el flujo completo' : 'Siguiente' + ico('next');
  fit();
}
function closeDrawer(){ drawer.classList.remove('open'); drawer.setAttribute('aria-hidden', 'true'); fit(); }
function goTo(i){
  hideCover();
  state.cur = Math.max(0, Math.min(PASOS.length - 1, i)); state.finished = false;
  paint(); openDrawer(PASOS[state.cur]);
  try { history.replaceState(null, '', '#paso-' + PASOS[state.cur].id); } catch (_) {}
  if (state.playing) schedule();
}
function overview(finished){
  state.cur = -1; state.finished = !!finished; stopPlay(); closeDrawer(); paint();
  try { history.replaceState(null, '', location.pathname + location.search); } catch (_) {}
}
function next(){ if (state.cur >= PASOS.length - 1) overview(true); else goTo(state.cur + 1); }
function prev(){ if (state.cur > 0) goTo(state.cur - 1); }
function schedule(){ clearTimeout(timer); timer = setTimeout(() => { if (state.cur >= PASOS.length - 1) overview(true); else { goTo(state.cur + 1); } }, 9000); }
function setPlayIcon(){ $('#btnPlay').innerHTML = ico(state.playing ? 'pause' : 'play'); }
function startPlay(){ state.playing = true; setPlayIcon(); if (state.cur < 0) goTo(0); else schedule(); }
function stopPlay(){ state.playing = false; clearTimeout(timer); setPlayIcon(); }

/* ---------- Portada, tema y pantalla completa ---------- */
const cover = $('#cover');
function hideCover(){ cover.classList.add('hide'); }
$('#btnStart').addEventListener('click', () => goTo(0));
$('#btnExplore').addEventListener('click', () => { hideCover(); overview(false); });
function currentTheme(){ const t = document.documentElement.dataset.theme; if (t) return t; return matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
function setThemeIcon(){ $('#btnTheme').innerHTML = ico(currentTheme() === 'dark' ? 'sun' : 'moon'); }
$('#btnTheme').addEventListener('click', () => {
  const t = currentTheme() === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = t;
  try { localStorage.setItem('nv-flujo-tema', t); } catch (_) {}
  setThemeIcon();
});
try { const t = localStorage.getItem('nv-flujo-tema'); if (t) document.documentElement.dataset.theme = t; } catch (_) {}
setThemeIcon();
$('#btnFull').addEventListener('click', () => {
  if (!document.fullscreenElement && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
  else if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
});

/* ---------- Controles ---------- */
$('#btnPrev').addEventListener('click', prev);
$('#btnNext').addEventListener('click', () => state.cur < 0 ? goTo(0) : next());
$('#btnPlay').addEventListener('click', () => state.playing ? stopPlay() : startPlay());
$('#btnOverview').addEventListener('click', () => overview(false));
$('#btnClose').addEventListener('click', () => overview(false));
$('#dPrev').addEventListener('click', prev);
$('#dNext').addEventListener('click', next);
addEventListener('keydown', ev => {
  if (ev.target.closest && ev.target.closest('input,textarea')) return;
  if (ev.key === 'ArrowRight' || ev.key === ' ' || ev.key === 'PageDown'){ ev.preventDefault(); if (!cover.classList.contains('hide')) goTo(0); else state.cur < 0 ? goTo(0) : next(); }
  else if (ev.key === 'ArrowLeft' || ev.key === 'PageUp'){ ev.preventDefault(); prev(); }
  else if (ev.key === 'Escape'){ overview(false); }
  else if (ev.key === 'p' || ev.key === 'P'){ state.playing ? stopPlay() : startPlay(); }
  else if (ev.key === 'f' || ev.key === 'F'){ $('#btnFull').click(); }
});

/* ---------- Inicio ---------- */
setPlayIcon(); paint(); fit();
requestAnimationFrame(fit);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
const h = (location.hash || '').replace('#', '');
if (h.startsWith('paso-') && BY[h.slice(5)]) goTo(BY[h.slice(5)].idx);
else if (h === 'flujo') { hideCover(); overview(false); }
})();
</script>
</body>
</html>
